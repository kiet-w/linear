<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DevOS - Quick Push</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#34343b",
                        "secondary-fixed": "#e2e2e2",
                        "inverse-on-surface": "#303037",
                        "surface-variant": "#34343b",
                        "tertiary-fixed": "#ffddbb",
                        "secondary-fixed-dim": "#c6c6c7",
                        "outline": "#908f9e",
                        "surface-dim": "#121319",
                        "on-tertiary-fixed": "#2b1700",
                        "outline-variant": "#454652",
                        "error-container": "#93000a",
                        "primary-container": "#5e6ad2",
                        "on-error-container": "#ffdad6",
                        "secondary": "#c6c6c7",
                        "on-primary-fixed": "#000965",
                        "on-primary-container": "#fdfaff",
                        "surface-tint": "#bdc2ff",
                        "tertiary-container": "#a56500",
                        "on-secondary-container": "#b4b5b5",
                        "surface": "#121319",
                        "secondary-container": "#454747",
                        "tertiary": "#ffb867",
                        "surface-container": "#1f1f26",
                        "primary": "#bdc2ff",
                        "inverse-surface": "#e4e1eb",
                        "primary-fixed-dim": "#bdc2ff",
                        "background": "#121319",
                        "primary-fixed": "#dfe0ff",
                        "on-surface": "#e4e1eb",
                        "on-tertiary": "#482900",
                        "surface-bright": "#393840",
                        "inverse-primary": "#4854bb",
                        "on-primary-fixed-variant": "#2e3aa2",
                        "surface-container-high": "#292930",
                        "tertiary-fixed-dim": "#ffb867",
                        "on-secondary": "#2f3131",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#c6c5d5",
                        "surface-container-lowest": "#0d0e14",
                        "surface-container-low": "#1b1b22",
                        "on-error": "#690005",
                        "on-background": "#e4e1eb",
                        "on-tertiary-fixed-variant": "#673d00",
                        "on-secondary-fixed": "#1a1c1c",
                        "on-secondary-fixed-variant": "#454747",
                        "on-primary": "#121f8b",
                        "on-tertiary-container": "#fffaf8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "element-gap": "8px",
                        "container-margin": "24px",
                        "sidebar-width": "240px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "display-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "mono-sm": ["Space Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "mono-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #454747;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex font-body-sm relative">
<!-- Background Mock (Task Board) -->
<div class="absolute inset-0 z-0">
<img alt="DevOS Task Board Background" class="w-full h-full object-cover opacity-30 filter blur-sm grayscale-[50%]" data-alt="A blurred background showing a complex, high-density dark mode task management board with kanban columns, technical data, and sleek UI components. The color palette is near-black with subtle violet primary accents, conveying a professional, developer-focused technical workspace." src="https://lh3.googleusercontent.com/aida/ADBb0uhOxRsd7s51jIPIQNswERwKw7YcO-BPGaVKZL_3S3qSHhL6Rcs1d4Ic89dvbzEgJa_fbNQctaRasu41jz9JG1OVwBG3_1ZPE0CUlRsr7Z5k-N3gass4G1Cs4POFjed3TAelpLsrUsodPqQ45U0BLd4Cl_TkjrNO3v-KpO8VQgrvu4Bc0VDzgMePxU8G37_kAJh0OXE6nEumIiThVFLZ03lz55gOFfuivNvMehsaXolrHuhhCepm8HJdLT2X1ysS7A3Sm5M7wf4bxg"/>
</div>
<!-- Overlay / Backdrop -->
<div class="absolute inset-0 bg-background/80 backdrop-blur-md z-40 flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="bg-surface-container-high border border-outline-variant rounded-lg w-full max-w-2xl shadow-2xl flex flex-col overflow-hidden">
<!-- Header -->
<div class="flex items-center justify-between p-container-margin border-b border-outline-variant bg-surface-container-highest/50">
<div class="flex items-center gap-element-gap">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">bolt</span>
<h2 class="font-display-sm text-display-sm text-on-surface">Quick Push</h2>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Content Area -->
<div class="p-container-margin flex flex-col gap-6 overflow-y-auto custom-scrollbar" style="max-height: calc(100vh - 200px);">
<!-- Branch Selection -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">Branch</label>
<div class="flex items-center gap-2 bg-surface-container-lowest border border-outline-variant rounded p-2">
<span class="material-symbols-outlined text-on-surface-variant text-sm">call_split</span>
<span class="font-mono-sm text-mono-sm text-primary">feat/board-view</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm mx-2">arrow_forward</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm">cloud</span>
<span class="font-mono-sm text-mono-sm text-on-surface">origin/feat/board-view</span>
</div>
</div>
<!-- Commit Message -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant">Commit Message</label>
<button class="flex items-center gap-1 text-primary-container hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[14px]">auto_awesome</span>
<span class="font-label-md text-label-md">Generate with AI</span>
</button>
</div>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded p-3 font-mono-sm text-mono-sm text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all h-24 resize-none placeholder:text-on-surface-variant/50" placeholder="feat(board): Implement Quick Push overlay logic..."></textarea>
<div class="flex justify-end">
<span class="font-label-md text-label-md text-on-surface-variant">54 / 72</span>
</div>
</div>
<div class="grid grid-cols-2 gap-6">
<!-- Pre-push Checks -->
<div class="flex flex-col gap-3">
<label class="font-label-md text-label-md text-on-surface-variant">Pre-push Checks</label>
<div class="flex flex-col gap-2">
<div class="flex items-center gap-2 bg-surface-container-lowest border border-outline-variant rounded p-2">
<span class="material-symbols-outlined text-[16px] text-green-400" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-sm text-body-sm text-on-surface">Linter: Passed</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-lowest border border-outline-variant rounded p-2">
<span class="material-symbols-outlined text-[16px] text-green-400" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-sm text-body-sm text-on-surface">Tests: 12/12 Passed</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-lowest border border-outline-variant rounded p-2">
<span class="material-symbols-outlined text-[16px] text-green-400" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-body-sm text-body-sm text-on-surface">Security Scan: Clear</span>
</div>
</div>
</div>
<!-- Files to Commit -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant">Staged Files (2)</label>
</div>
<div class="flex flex-col bg-surface-container-lowest border border-outline-variant rounded overflow-hidden h-[124px] overflow-y-auto custom-scrollbar">
<div class="flex items-center justify-between p-2 border-b border-outline-variant/50 hover:bg-surface-container-highest transition-colors group">
<div class="flex items-center gap-2 truncate">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">draft</span>
<span class="font-mono-sm text-mono-sm text-on-surface truncate">src/components/Board.tsx</span>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors opacity-0 group-hover:opacity-100">
<span class="material-symbols-outlined text-[16px]">remove</span>
</button>
</div>
<div class="flex items-center justify-between p-2 border-b border-outline-variant/50 hover:bg-surface-container-highest transition-colors group">
<div class="flex items-center gap-2 truncate">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">css</span>
<span class="font-mono-sm text-mono-sm text-on-surface truncate">src/styles/main.css</span>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors opacity-0 group-hover:opacity-100">
<span class="material-symbols-outlined text-[16px]">remove</span>
</button>
</div>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="flex items-center justify-end gap-3 p-container-margin border-t border-outline-variant bg-surface-container-highest/50">
<button class="px-4 py-2 rounded font-label-md text-label-md border border-outline-variant text-on-surface hover:bg-surface-container transition-colors">
                    Cancel
                </button>
<button class="flex items-center gap-2 px-4 py-2 rounded font-label-md text-label-md bg-primary-container text-on-primary-container hover:bg-primary-fixed transition-colors">
<span>Push to Origin</span>
<span class="flex items-center gap-0.5 opacity-70 bg-black/20 px-1.5 py-0.5 rounded font-mono-sm text-[10px]">
<span class="material-symbols-outlined text-[12px]">keyboard_command_key</span>
                        Enter
                    </span>
</button>
</div>
</div>
</div>
</body></html>
